<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>SITM-MIO — Dashboard de Análisis</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0f1724;
            --panel: #172033;
            --panel-2: #1f2a44;
            --accent: #38bdf8;
            --accent-2: #22d3ee;
            --good: #34d399;
            --warn: #fbbf24;
            --bad: #f87171;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(180deg, #0b1220 0%, #0f1724 100%);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 22px;
            background: rgba(15, 23, 36, 0.85);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(6px);
        }
        header .brand { display: flex; align-items: center; gap: 12px; }
        header .logo {
            width: 38px; height: 38px; border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; color: #04243a;
        }
        header h1 { font-size: 18px; margin: 0; font-weight: 600; }
        header .subtitle { font-size: 12px; color: var(--muted); }
        .version-badge {
            padding: 6px 14px; border-radius: 999px;
            background: var(--panel-2); color: var(--accent);
            border: 1px solid var(--accent); font-weight: 600;
            font-size: 12px; letter-spacing: 0.5px;
        }
        main {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            grid-template-rows: 1fr auto;
            gap: 14px;
            padding: 14px;
            height: calc(100vh - 67px);
            overflow: hidden;
        }
        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .panel h2 {
            font-size: 13px;
            margin: 0 0 10px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .panel h2 .pill {
            font-size: 11px; padding: 3px 10px; border-radius: 999px;
            background: rgba(56, 189, 248, 0.12); color: var(--accent);
            border: 1px solid var(--accent); letter-spacing: 0.3px;
        }
        #map-panel { grid-row: 1 / span 2; }
        #map {
            flex: 1; border-radius: 10px; overflow: hidden;
            border: 1px solid var(--border);
        }
        .legend-strip {
            display: flex; align-items: center; gap: 12px;
            margin-top: 10px; font-size: 12px; color: var(--muted);
        }
        .legend-strip .dot {
            display: inline-block; width: 10px; height: 10px; border-radius: 50%;
            margin-right: 4px; vertical-align: middle;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }
        .kpi {
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
        }
        .kpi .label {
            font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px;
        }
        .kpi .value {
            font-size: 22px; font-weight: 700; margin-top: 4px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .kpi .unit { font-size: 12px; color: var(--muted); margin-left: 6px; font-weight: 400; }
        .chart-wrap { position: relative; height: 200px; }
        #table-panel {
            grid-column: 1 / span 2;
            grid-row: 2;
            min-height: 260px;
            max-height: 280px;
        }
        .table-controls {
            display: flex; gap: 10px; margin-bottom: 8px; align-items: center;
        }
        .table-controls input {
            flex: 1;
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            padding: 8px 12px;
            font-size: 13px;
        }
        .table-controls select {
            background: var(--panel-2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
        }
        .table-scroll {
            flex: 1; overflow: auto; border-radius: 8px;
            border: 1px solid var(--border);
        }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        thead th {
            position: sticky; top: 0;
            background: var(--panel-2);
            text-align: left;
            padding: 9px 12px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            user-select: none;
        }
        thead th:hover { color: var(--accent); }
        tbody td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
        tbody tr:hover { background: rgba(56, 189, 248, 0.05); }
        .status-ok { color: var(--good); font-weight: 600; }
        .status-no-data { color: var(--muted); }
        .speed-bar {
            display: inline-block; height: 6px; border-radius: 999px;
            background: var(--good); vertical-align: middle; margin-right: 8px;
        }
        #file-pill {
            font-size: 12px; color: var(--muted);
            background: var(--panel-2); padding: 4px 10px; border-radius: 6px;
        }
    </style>
</head>
<body>

<header>
    <div class="brand">
        <div class="logo">M</div>
        <div>
            <h1>SITM-MIO — Dashboard de Análisis</h1>
            <div class="subtitle">Velocidades promedio por ruta · Sistema Integrado de Transporte Masivo de Cali</div>
        </div>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
        <span id="file-pill">Sin archivo</span>
        <span class="version-badge" id="version-badge">--</span>
    </div>
</header>

<main>

    <section id="map-panel" class="panel">
        <h2>Mapa de rutas <span class="pill" id="map-version-tag">--</span></h
